services:
  db:
    image: postgres:16-alpine
    container_name: hai_lab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: hai_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d hai_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
